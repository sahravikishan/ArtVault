<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo: Modern Brutalist</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFFFF;
      --text: #050505;
      --border: #050505;
      --accent: #0033FF; /* Electric Blue */
      --muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      padding: 0;
      line-height: 1.6;
    }

    h1, h2, h3, .logo {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    a { color: var(--text); text-decoration: none; }

    /* Header */
    header {
      border-bottom: 2px solid var(--border);
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
    }

    nav a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 8px 16px;
      margin-left: 10px;
      transition: all 0.2s;
    }

    nav a:hover {
      background: var(--text);
      color: var(--bg);
    }

    /* Main */
    main {
      padding: 4rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 2rem;
      border-bottom: 4px solid var(--border);
      padding-bottom: 1rem;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 3rem;
    }

    /* Card Brutalist Style */
    .card {
      border: 2px solid var(--border);
      background: #fff;
      /* Brutalist hard shadow */
      box-shadow: 8px 8px 0px var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 12px 12px 0px var(--accent);
      border-color: var(--accent);
    }

    .card-img {
      border-bottom: 2px solid var(--border);
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #eee;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(20%);
      transition: filter 0.3s;
    }

    .card:hover .card-img img {
      filter: grayscale(0%);
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--text);
      color: #fff;
      padding: 4px 8px;
      display: inline-block;
      align-self: flex-start;
      margin-bottom: 1rem;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .artist {
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .footer-row {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .price {
      color: var(--accent);
      font-size: 1.1rem;
    }

  </style>
</head>
<body>

  <header>
    <div class="logo">ART<span>VAULT</span></div>
    <nav>
      <a href="#">Collection</a>
      <a href="#" style="background:var(--accent); color:#fff; border-color:var(--accent);">Admin</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">EXHIBIT_01</h1>
    
    <div class="grid">
      <!-- Card 1 -->
      <article class="card">
        <div class="card-img">
          <!-- Placeholder art -->
          <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=600&q=80" alt="Art">
        </div>
        <div class="card-content">
          <span class="tag">ABSTRACT</span>
          <h2>Void #7 (The Stillness Between)</h2>
          <p class="artist">Hiroshi Tanaka · 2021</p>
          <div class="footer-row">
            <span>AVAILABLE</span>
            <span class="price">₹15,000.00</span>
          </div>
        </div>
      </article>

      <!-- Card 2 -->
      <article class="card">
        <div class="card-img">
          <img src="https://images.unsplash.com/photo-1518998053401-878c735c9032?auto=format&fit=crop&w=600&q=80" alt="Art">
        </div>
        <div class="card-content">
          <span class="tag">CONTEMPORARY</span>
          <h2>Frequencies of Red</h2>
          <p class="artist">Hiroshi Tanaka · 2019</p>
          <div class="footer-row">
            <span>AVAILABLE</span>
            <span class="price">₹12,500.00</span>
          </div>
        </div>
      </article>

      <!-- Card 3 -->
      <article class="card">
        <div class="card-img">
          <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=600&q=80" alt="Art">
        </div>
        <div class="card-content">
          <span class="tag">SURREALISM</span>
          <h2>The Ancestor Wears a Business Suit</h2>
          <p class="artist">Amara Osei · 2022</p>
          <div class="footer-row">
            <span>AVAILABLE</span>
            <span class="price">₹14,000.00</span>
          </div>
        </div>
      </article>
    </div>
  </main>

</body>
</html>
